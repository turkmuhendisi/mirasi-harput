services:
  mirasiharput-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mirasiharput-api
    restart: unless-stopped
    ports:
      # Diğer projelerle çakışmaması için özel port
      - "8087:80"
    env_file:
      - .env
    volumes:
      # Üretilen sertifikalar konteyner yeniden başlasa da kalır
      - ./storage/certificates:/var/www/html/storage/certificates
      # Şablon + font dosyaları sunucudan (rebuild gerektirmez)
      - ./assets:/var/www/html/assets:ro
    networks:
      - mirasiharput-net

networks:
  mirasiharput-net:
    name: mirasiharput-net
